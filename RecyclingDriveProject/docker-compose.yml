
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: docker-backend-2400032863
    container_name: recycling-backend
    ports:
      - "8081:8081"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: docker-frontend-2400032863
    container_name: recycling-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
